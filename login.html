<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civequizz - Login e Cadastro</title>
    <link rel="icon" href="img/icon.png" type="image/png">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-header">
            <img src="img/logo.png" alt="Civequizz" class="logo-img">
            <p class="login-subtitle">Plataforma de Desafios Gamificados</p>
        </div>

        <!-- TELA DE LOGIN -->
        <div id="box-login" class="auth-box">
            <h2>Acessar sua Conta</h2>
            <form onsubmit="realizarLogin(event)">
                <div class="form-group">
                    <label>E-mail ou Login</label>
                    <input type="text" id="login-email" placeholder="seuemail@exemplo.com ou Admin" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login-senha" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-auth">Entrar na Plataforma ⚡</button>
            </form>
            <div class="switch-auth">
                Não tem uma conta? <a href="#" onclick="mostrarAbaAuth('cadastro')">Cadastre-se</a>
            </div>
        </div>

        <!-- TELA DE CADASTRO -->
        <div id="box-cadastro" class="auth-box hidden">
            <h2>Criar nova conta</h2>
            <form id="form-cadastro" onsubmit="realizarCadastro(event)">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="cad-nome" placeholder="Digite seu nome completo" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>E-mail</label>
                        <input type="email" id="cad-email" placeholder="seuemail@exemplo.com" required>
                    </div>
                    <div class="form-group">
                        <label>CPF</label>
                        <input type="text" id="cad-cpf" placeholder="000.000.000-00" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Data de Nascimento</label>
                        <input type="date" id="cad-data-nasc" required>
                    </div>
                    <div class="form-group">
                        <label>Registro Acadêmico (RA)</label>
                        <input type="text" id="cad-ra" placeholder="Ex: 202600123" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Selecione seu Curso</label>
                    <select id="cad-curso" required>
                        <option value="" disabled selected>Escolha o seu curso...</option>
                        <option value="lic_teste1">Licenciatura - Teste 1</option>
                        <option value="lic_teste2">Licenciatura - Teste 2</option>
                        <option value="bac_teste1">Bacharel - Teste 1</option>
                        <option value="tec_teste1">Tecnólogo - Teste 1</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="cad-senha" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label>Confirmar Senha</label>
                        <input type="password" id="cad-confirma-senha" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn-auth">Finalizar Cadastro 🚀</button>
            </form>
            <div class="switch-auth">
                Já possui uma conta? <a href="#" onclick="mostrarAbaAuth('login')">Fazer Login</a>
            </div>
        </div>

    </div>

    <script src="./script.js"></script>
</body>
</html>
